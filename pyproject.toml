[project]
name = "wahlwerk-site"
version = "0.1.0"
description = "The wahlwerk website: the engine's components, explained with real elections"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wahlwerk>=0.1.0",
    "wahlwerk-calc>=0.1.0",
    "wahlwerk-ui>=0.1.0",
]

[tool.uv]
# Not a package: build.py is run as a script and writes docs/data/.
package = false

[tool.uv.sources]
wahlwerk = { path = "../wahlwerk", editable = true }
wahlwerk-calc = { path = "../wahlwerk/calc", editable = true }
wahlwerk-ui = { path = "../wahlwerk-ui", editable = true }

[tool.mypy]
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.9",
]
